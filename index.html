<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F6C">
<title>SIAPS | Alagoas, relatório móvel</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;font-family:Arial,Helvetica,sans-serif;background:#edf1f4;color:#173a4a}.viewer{width:100%;height:auto;overflow:visible;background:#e6e6e6}.viewer iframe{width:100%;height:var(--report-height, 2036px);border:0;display:block;background:#e6e6e6}@media(min-width:650px){.viewer{max-width:440px;margin:0 auto;border-left:1px solid #ccc;border-right:1px solid #ccc}}
</style>
</head>
<body>
<main class="viewer"><iframe id="report" title="SIAPS Alagoas, Visão Geral móvel" loading="eager" allowfullscreen></iframe></main>
<script>
const mobileUrl='https://app.powerbi.com/view?r=eyJrIjoiYTRhODJkYmYtNjlmZS00MmIyLWE1MTEtY2E1MjUxMjY1YTU5IiwidCI6ImRiNWFiODZiLTU5YWEtNDRjNS1hOGVmLTBjN2FlYzU5NWY5MyJ9&pageName=6648b3d760d1935780e3';
const viewer=document.querySelector('.viewer');
const report=document.getElementById('report');
// Canvas do piloto: 390 x 1980. Reserva inicial de 56 px para a barra do Power BI.
function resizeReport(){
  const width=viewer.clientWidth;
  report.style.setProperty('--report-height', Math.ceil(width * 1980 / 390 + 56) + 'px');
}
resizeReport();
new ResizeObserver(resizeReport).observe(viewer);
report.src=mobileUrl;

</script>
</body>
</html>
